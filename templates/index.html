<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1b1a2e; --muted: #6b6980; --paper: #f4f2fa; --surface: #ffffff; --line: #dedbea;
      --accent: #b4235a; --accent-2: #1f7a8c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ecebf5; --muted: #9c99b3; --paper: #14131f; --surface: #1c1b2b; --line: #2d2b42;
        --accent: #ff6b9a; --accent-2: #5ec2d3;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 "Bricolage Grotesque", system-ui, sans-serif; }
    main { max-width: 1040px; margin: 0 auto; padding: 56px 24px 96px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
    h2 { margin: 72px 0 24px; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; }
    h3 { margin: 0 0 12px; font-size: 1rem; font-weight: 600; }
    p { margin: 0; }
    .muted { color: var(--muted); }

    .launch { padding-bottom: 40px; border-bottom: 1px solid var(--line); }
    .fields { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-top: 24px; }
    .field { display: grid; gap: 6px; font-weight: 600; }
    .field.grow { flex: 1 1 280px; }
    input[type="text"], input[type="number"], input[type="search"] { padding: 10px 14px; font: inherit; font-weight: 400; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    input[type="number"] { width: 6.5rem; }
    #start { padding: 11px 22px; font: inherit; font-weight: 600; color: var(--paper); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    #start:disabled { opacity: 0.55; cursor: progress; }
    .check { display: flex; gap: 8px; align-items: center; margin-top: 16px; color: var(--muted); }
    progress { display: block; width: 100%; height: 8px; margin-top: 20px; accent-color: var(--accent); }
    .status { min-height: 1.5em; margin-top: 12px; color: var(--muted); }
    .status.error { color: var(--accent); font-weight: 600; }
    #empty { margin-top: 40px; font-size: 1.15rem; }
    #results { margin-top: 56px; }

    .handle { margin: 0; font-size: clamp(2.6rem, 8vw, 5.2rem); font-weight: 800; line-height: 1; letter-spacing: -0.03em; overflow-wrap: anywhere; }
    .bio { max-width: 60ch; margin-top: 24px; font-size: 1.15rem; white-space: pre-line; }
    .counts { display: flex; flex-wrap: wrap; gap: 8px 32px; margin-top: 28px; font-size: 1.25rem; color: var(--muted); }
    .counts strong { color: var(--ink); font-size: 1.6rem; font-weight: 800; }
    .meta { margin-top: 12px; font-size: 0.9rem; color: var(--muted); }

    .insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .insight-grid .wide { grid-column: 1 / -1; }
    .mix { display: flex; gap: 3px; height: 16px; margin-bottom: 10px; }
    .mix span { border-radius: 8px; min-width: 8px; }
    .big { font-size: 1.3rem; line-height: 1.4; }
    .words { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .words li { display: grid; grid-template-columns: 8rem 1fr 2.5rem; align-items: center; gap: 12px; }
    .track { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
    .fill { display: block; height: 100%; background: var(--accent-2); border-radius: 5px; }
    .count { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    input[type="search"] { flex: 1 1 260px; }
    #filters { display: flex; gap: 8px; }
    #filters button { padding: 8px 16px; font: inherit; text-transform: capitalize; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
    #filters button[aria-pressed="true"] { color: var(--paper); background: var(--ink); border-color: var(--ink); }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .post-list { list-style: none; margin: 16px 0 0; padding: 0; }
    .post-list > li { display: grid; grid-template-columns: 4rem 1fr auto; gap: 20px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .type { font-weight: 600; }
    .metrics { margin-top: 4px; font-size: 0.9rem; color: var(--muted); }
    details { margin-top: 8px; }
    summary { width: fit-content; cursor: pointer; color: var(--accent-2); }
    .comments { list-style: none; display: grid; gap: 6px; margin: 10px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); font-size: 0.95rem; }
    .comments strong { margin-right: 6px; }
    .post-list a { color: var(--accent); text-underline-offset: 3px; white-space: nowrap; }

    @media (max-width: 760px) {
      main { padding-top: 40px; }
      .insight-grid { grid-template-columns: 1fr; gap: 32px; }
      .words li { grid-template-columns: 6rem 1fr 2rem; }
      .post-list > li { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>
<body>
  <main>
    <form id="scrape-form" class="launch">
      <h1>Profile Analyzer</h1>
      <p class="muted">Enter a public Instagram username to collect its profile data and posts.</p>
      <div class="fields">
        <label class="field grow">Username
          <input id="username" type="text" required placeholder="natgeo" autocomplete="off" spellcheck="false" pattern="@?[A-Za-z0-9._]{1,30}">
        </label>
        <label class="field">Posts
          <input id="posts" type="number" min="1" max="200" value="50">
        </label>
        <label class="field" title="Posts opened one by one to read caption, likes and comments (0 to skip)">Detailed posts
          <input id="details" type="number" min="0" max="30" value="10">
        </label>
        <button id="start" type="submit">Scrape profile</button>
      </div>
      <label class="check"><input id="show-browser" type="checkbox" checked> Show the browser window while scraping</label>
      <progress id="bar" hidden></progress>
      <p id="status" class="status" role="status"></p>
    </form>

    <p id="empty" class="muted" hidden>No data yet. Scrape a profile above and the results will appear here.</p>

    <div id="results" hidden>
      <header>
        <h2 id="handle" class="handle"></h2>
        <p id="bio" class="bio"></p>
        <p id="counts" class="counts"></p>
        <p id="meta" class="meta"></p>
      </header>

      <section aria-labelledby="insights-title">
        <h2 id="insights-title">What the posts show</h2>
        <div class="insight-grid">
          <div>
            <h3>Content mix</h3>
            <div id="mix" class="mix"></div>
            <p id="mix-legend" class="muted"></p>
          </div>
          <div>
            <h3>Descriptions</h3>
            <p id="coverage" class="big"></p>
          </div>
          <div class="wide" id="engagement-block" hidden>
            <h3>Likes and comments</h3>
            <p id="engagement" class="big"></p>
          </div>
          <div class="wide">
            <h3>Most used words in captions and descriptions</h3>
            <ul id="words" class="words"></ul>
          </div>
        </div>
      </section>

      <section aria-labelledby="posts-title">
        <h2 id="posts-title">Posts</h2>
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search descriptions" aria-label="Search descriptions">
          <div id="filters" role="group" aria-label="Filter by type"></div>
        </div>
        <p id="result-count" class="muted"></p>
        <ul id="post-list" class="post-list"></ul>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const el = (tag, props = {}, ...children) => {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    };
    const getJson = async (url) => (await fetch(url)).json();
    const typeColor = (type) => ({ post: "var(--accent)", reel: "var(--accent-2)" })[type] ?? "var(--muted)";
    const state = { posts: [], type: "all", query: "" };

    function setBusy(busy) {
      $("start").disabled = busy;
      $("bar").hidden = !busy;
      if (busy) $("bar").removeAttribute("value");
    }

    function setStatus(message, isError = false) {
      $("status").textContent = message;
      $("status").classList.toggle("error", isError);
    }

    function renderProfile(profile) {
      $("handle").textContent = `@${profile.username}`;
      $("bio").textContent = profile.biography || "No biography found.";
      const counts = [["followers", profile.followers], ["following", profile.following], ["posts", profile.posts_count]];
      $("counts").replaceChildren(...counts.filter(([, value]) => value)
        .map(([label, value]) => el("span", {}, el("strong", { textContent: value }), ` ${label}`)));
      $("meta").textContent = `Scraped ${new Date(profile.scraped_at).toLocaleString()}`;
    }

    function renderEngagement({ detailed, avg_likes, avg_comments, comments_read, top_url, top_likes }) {
      $("engagement-block").hidden = !detailed;
      if (!detailed) return;
      const fmt = (value) => value.toLocaleString();
      const parts = [
        avg_likes === null ? "likes are hidden" : `${fmt(avg_likes)} likes on average`,
        ...(avg_comments === null ? [] : [`${fmt(avg_comments)} comments on average`]),
        `${comments_read} comments read`,
      ];
      $("engagement").replaceChildren(
        `Across ${detailed} detailed posts: ${parts.join(", ")}.`,
        ...(top_url ? [" The most liked has ", el("a", { href: top_url, target: "_blank", rel: "noopener noreferrer", textContent: `${fmt(top_likes)} likes` }), "."] : []),
      );
    }

    function renderStats({ total, types, described, avg_description_length, top_words, engagement }) {
      renderEngagement(engagement);
      const entries = Object.entries(types);
      $("mix").replaceChildren(...entries.map(([type, count]) =>
        el("span", { style: `flex:${count};background:${typeColor(type)}` })));
      $("mix-legend").textContent = entries.map(([type, count]) => `${count} ${type}s`).join(", ");
      $("coverage").textContent = `${described} of ${total} posts have a description, averaging ${avg_description_length} characters.`;

      const max = Math.max(1, ...top_words.map((item) => item.count));
      $("words").replaceChildren(...top_words.map(({ word, count }) => el("li", {},
        el("span", { textContent: word }),
        el("span", { className: "track" }, el("span", { className: "fill", style: `width:${(count / max) * 100}%` })),
        el("span", { className: "count", textContent: count }))));
    }

    function postBody(post) {
      const body = el("div", {}, el("p", {
        className: post.caption || post.description ? "" : "muted",
        textContent: post.caption || post.description || "No description",
      }));
      if (!("caption" in post)) return body;

      const metrics = [
        post.likes == null ? "likes hidden" : `${post.likes.toLocaleString()} likes`,
        post.comments_count == null ? "" : `${post.comments_count.toLocaleString()} comments`,
        post.posted_at ? new Date(post.posted_at).toLocaleDateString() : "",
      ];
      body.append(el("p", { className: "metrics", textContent: metrics.filter(Boolean).join(", ") }));
      if (post.comments.length) {
        body.append(el("details", {},
          el("summary", { textContent: `${post.comments.length} comments read` }),
          el("ul", { className: "comments" }, ...post.comments.map((comment) =>
            el("li", {}, el("strong", { textContent: comment.author }), comment.text)))));
      }
      return body;
    }

    function renderPosts() {
      const query = state.query.toLowerCase();
      const rows = state.posts.filter((post) =>
        (state.type === "all" || post.type === state.type) &&
        `${post.caption || ""} ${post.description}`.toLowerCase().includes(query));
      $("result-count").textContent = `Showing ${rows.length} of ${state.posts.length} posts`;
      $("post-list").replaceChildren(...rows.map((post) => el("li", {},
        el("span", { className: "type", textContent: post.type, style: `color:${typeColor(post.type)}` }),
        postBody(post),
        el("a", { href: post.url, target: "_blank", rel: "noopener noreferrer", textContent: "Open post" }))));
    }

    function setupFilters(types) {
      const buttons = ["all", ...types].map((type) => {
        const button = el("button", { type: "button", textContent: type });
        button.setAttribute("aria-pressed", type === state.type);
        button.onclick = () => {
          state.type = type;
          buttons.forEach((other) => other.setAttribute("aria-pressed", other === button));
          renderPosts();
        };
        return button;
      });
      $("filters").replaceChildren(...buttons);
    }

    async function loadResults() {
      const { profile, posts, stats } = await getJson("/api/data");
      $("results").hidden = !profile;
      $("empty").hidden = Boolean(profile);
      if (!profile) return;

      Object.assign(state, { posts, type: "all", query: "" });
      $("search").value = "";
      renderProfile(profile);
      renderStats(stats);
      setupFilters(Object.keys(stats.types));
      renderPosts();
    }

    async function pollJob() {
      const job = await getJson("/api/status");
      if (job.state === "running") {
        if (job.stage) {
          const labels = { posts: "Collecting posts", details: "Reading post details" };
          $("bar").max = job.total || 1;
          $("bar").value = job.progress;
          setStatus(`${labels[job.stage]}: ${job.progress} of ${job.total}`);
        } else {
          setStatus(job.message || `Opening @${job.username}…`);
        }
        setTimeout(pollJob, 1500);
        return;
      }
      setBusy(false);
      if (job.state === "error") return setStatus(job.error, true);
      setStatus(`Finished scraping @${job.username}.`);
      await loadResults();
      $("results").scrollIntoView({ behavior: "smooth" });
    }

    $("scrape-form").onsubmit = async (event) => {
      event.preventDefault();
      setBusy(true);
      setStatus("Starting…");
      const response = await fetch("/api/scrape", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: $("username").value,
          posts: $("posts").value,
          details: $("details").value,
          headless: !$("show-browser").checked,
        }),
      });
      if (!response.ok) {
        setBusy(false);
        return setStatus((await response.json()).error, true);
      }
      pollJob();
    };

    $("search").oninput = (event) => {
      state.query = event.target.value;
      renderPosts();
    };

    (async () => {
      await loadResults();
      if ((await getJson("/api/status")).state === "running") {
        setBusy(true);
        pollJob();
      }
    })();
  </script>
</body>
</html>
